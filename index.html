<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>AI 자기소개서 합격률 분석</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 24px; }
    label { font-weight: 600; }
    input, textarea, button { width: 520px; max-width: 100%; padding: 10px; margin-top: 6px; }
    textarea { height: 220px; }
    button { width: auto; cursor: pointer; }
    .row { margin: 14px 0; }
    #resultBox { white-space: pre-wrap; border: 1px solid #ddd; padding: 12px; margin-top: 16px; width: 520px; max-width: 100%; }
    .muted { color: #666; font-size: 12px; margin-top: 6px; }
  </style>
</head>

<body>
  <h2>자기소개서 합격률 분석</h2>

  <form id="essayForm">
    <div class="row">
      <label>회사 이름</label><br>
      <input type="text" id="companyName" required placeholder="예: KOICA" />
    </div>

    <div class="row">
      <label>회사 URL</label><br>
      <input type="text" id="companyUrl" required placeholder="https://www.koica.go.kr/..." />
      <div class="muted">URL은 https:// 로 시작해야 합니다.</div>
    </div>

    <div class="row">
      <label>자기소개서</label><br>
      <textarea id="userEssay" required placeholder="자기소개서 내용을 붙여넣으세요."></textarea>
    </div>

    <button type="submit">분석하기</button>
  </form>

  <div id="resultBox">결과가 여기 표시됩니다.</div>

  <script>
    const WEBHOOK_URL = "https://primary-production-b57a.up.railway.app/webhook/final_essay";

    const form = document.getElementById("essayForm");
    const resultBox = document.getElementById("resultBox");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const payload = {
        companyName: companyName.value.trim(),
        companyUrl: companyUrl.value.trim(),
        userEssay: userEssay.value
      };

      if (!payload.companyName || !payload.companyUrl || !payload.userEssay) {
        resultBox.textContent = "모든 항목을 입력해주세요.";
        return;
      }

      resultBox.textContent = "분석 중...";

      try {
        const res = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const text = await res.text();

        if (!res.ok) {
          resultBox.textContent = `서버 에러 (${res.status})\n\n${text}`;
          return;
        }

        try {
          const data = JSON.parse(text);
          resultBox.textContent = data.result ?? text;
        } catch {
          resultBox.textContent = text;
        }
      } catch (err) {
        resultBox.textContent = "요청 실패(CORS/네트워크). n8n에 CORS 헤더를 추가하세요.";
      }
    });
  </script>
</body>
</html>
