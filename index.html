<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>AI 자기소개서 합격률 분석</title>

  <!-- SUIT 폰트 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/static/woff2/SUIT.css">

  <style>
    :root{
      --border: rgba(255,255,255,.14);
      --text: rgba(255,255,255,.92);
      --muted2: rgba(255,255,255,.55);
      --shadow: 0 16px 50px rgba(0,0,0,.35);
      --radius: 18px;
      --danger: #ef4444;
      --ok: #22c55e;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body{
      margin: 0;
      color: var(--text);
      font-family: "SUIT", system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(900px 520px at 12% 10%, rgba(124,58,237,.22), transparent 60%),
        radial-gradient(820px 520px at 88% 12%, rgba(6,182,212,.18), transparent 60%),
        radial-gradient(980px 620px at 50% 120%, rgba(34,197,94,.08), transparent 60%),
        linear-gradient(180deg, #0b1020, #111a33 45%, #0b1020);
      background-attachment: fixed;
      overflow-x: hidden;
    }
    body::before{
      content:"";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,.045), transparent 40%),
        radial-gradient(circle at 80% 0%, rgba(255,255,255,.03), transparent 42%),
        linear-gradient(transparent, rgba(0,0,0,.12));
      mix-blend-mode: overlay;
      opacity: .45;
    }

    .wrap{
      position: relative;
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 18px 56px;
    }

    h1, h2{
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .brand{
      display:flex; align-items:center; gap: 12px;
    }

    .logo{
      width: 42px; height: 42px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(124,58,237,.90), rgba(6,182,212,.75));
      box-shadow: 0 12px 26px rgba(124,58,237,.18);
      position: relative;
      overflow:hidden;
      display:grid;
      place-items:center;
    }
    .logo::after{
      content:"";
      position:absolute; inset:-30%;
      background: radial-gradient(circle at 30% 20%, rgba(255,255,255,.55), transparent 45%);
      transform: rotate(15deg);
      pointer-events:none;
    }
    .logo svg{
      position: relative;
      z-index: 2;
      width: 22px;
      height: 22px;
      opacity: .95;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,.18));
    }

    .brand h1{
      font-size: 18px;
      margin: 0;
      line-height: 1.1;
    }
    .brand p{
      margin: 2px 0 0;
      font-size: 12.5px;
      color: var(--muted2);
    }

    .pill{
      display:flex; align-items:center; gap: 8px;
      padding: 10px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 10px 22px rgba(0,0,0,.20);
      color: rgba(255,255,255,.72);
      font-size: 12.5px;
      user-select: none;
      white-space: nowrap;
    }
    .dot{
      width: 9px; height: 9px;
      border-radius: 999px;
      background: var(--ok);
      box-shadow: 0 0 0 6px rgba(34,197,94,.10);
    }

    .grid{
      display:grid;
      grid-template-columns: 1.05fr .95fr;
      gap: 16px;
      align-items: stretch;
    }
    @media (max-width: 960px){
      .grid{ grid-template-columns: 1fr; }
      .pill{ display:none; }
    }

    .card{
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.05));
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(10px);
      display:flex;
      flex-direction: column;
      min-height: 100%;
    }

    .cardBody{
      padding: 16px;
      flex: 1;
      display:flex;
      flex-direction: column;
    }

    .fieldRow{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }
    .fieldRow > div{ display:flex; flex-direction: column; }
    @media (max-width: 640px){
      .fieldRow{ grid-template-columns: 1fr; }
    }

    label{
      display:block;
      font-size: 12px;
      color: rgba(255,255,255,.58);
      margin: 0 0 6px;
      padding-left: 2px;
    }

    input, textarea, button{
      font-family: "SUIT", system-ui, -apple-system, sans-serif;
    }

    input, textarea{
      width: 100%;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.20);
      color: var(--text);
      padding: 12px 12px;
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
      font-size: 14px;
    }

    textarea#userEssay{
      min-height: 360px;
      resize: vertical;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.22) transparent;
    }
    textarea#userEssay::-webkit-scrollbar{ width: 8px; }
    textarea#userEssay::-webkit-scrollbar-track{ background: transparent; }
    textarea#userEssay::-webkit-scrollbar-thumb{
      background: rgba(255,255,255,.20);
      border-radius: 999px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }
    textarea#userEssay::-webkit-scrollbar-thumb:hover{
      background: rgba(255,255,255,.28);
      border: 2px solid transparent;
      background-clip: padding-box;
    }

    input:focus, textarea:focus{
      border-color: rgba(124,58,237,.45);
      box-shadow: 0 0 0 4px rgba(124,58,237,.14);
      background: rgba(0,0,0,.24);
    }

    @media (max-width: 960px){
      textarea#userEssay{ min-height: 300px; }
    }

    .actions{
      display:flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
      align-items:center;
      justify-content: flex-start;
    }
    .leftActions{
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items:center;
    }

    /* ✅ 버튼 높이 완전 통일 (좌측 3개 + 우측 결과복사) */
    .btn{
      height: 40px;
      min-height: 40px;
      line-height: 1;
      padding: 0 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.07);
      color: var(--text);
      border-radius: 14px;
      cursor: pointer;
      transition: transform .05s ease, background .15s ease, border-color .15s ease, filter .15s ease;
      font-size: 13px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap: 8px;
      user-select:none;
      white-space: nowrap;
    }
    .btn:active{ transform: translateY(1px); }
    .btn:hover{ border-color: rgba(255,255,255,.22); }

    .btnPrimary{
      border: 1px solid rgba(255,255,255,.18);
      background: linear-gradient(135deg, rgba(124,58,237,.55), rgba(6,182,212,.32));
      box-shadow: 0 14px 28px rgba(124,58,237,.10);
    }
    .btnPrimary:hover{
      filter: brightness(1.06);
      background: linear-gradient(135deg, rgba(124,58,237,.62), rgba(6,182,212,.36));
    }

    .btnDanger{
      background: rgba(239,68,68,.12);
      border-color: rgba(239,68,68,.22);
      color: rgba(255,255,255,.92);
    }

    .rightCard{
      display:flex;
      flex-direction: column;
    }

    .resultTop{
      padding: 16px 16px 20px;
      border-bottom: 1px solid rgba(255,255,255,.10);
      background: linear-gradient(180deg, rgba(255,255,255,.06), transparent);
      display:flex;
      align-items:flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .scoreWrap{
      display:flex;
      align-items:baseline;
      gap: 10px;
      min-width: 0;
    }

    .score{
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.7px;
      line-height: 1;
      white-space: nowrap;
    }
    .scoreMeta{
      color: rgba(255,255,255,.60);
      font-size: 12.5px;
      white-space: nowrap;
    }

    .progress{
      height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.10);
      overflow:hidden;
      margin-top: 10px;
    }
    .bar{
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, rgba(239,68,68,.80), rgba(245,158,11,.80), rgba(34,197,94,.80));
      border-radius: 999px;
      transition: width .45s ease;
    }

    .resultBody{
      position: relative;
      padding: 16px;
      flex: 1;
      display:flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ✅ 오른쪽 출력칸 영역을 5px 내려서 좌측 textarea 상/하단 라인 맞춤 */
    .rightCard .resultBody{
      margin-top: 10px;
    }

    .resultText{
      white-space: pre-wrap;
      line-height: 1.65;
      font-size: 14px;
      color: rgba(255,255,255,.88);
      background: rgba(0,0,0,.16);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 16px;
      padding: 14px;
      min-height: 360px;
      flex: 1;
    }
    @media (max-width: 960px){
      .resultText{ min-height: 300px; }
    }

    .resultActions{
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .kpi{
      display:grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 16px;
      border-top: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.03);
    }
    .kpiItem{
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.10);
      padding: 12px;
      min-height: 68px;
    }
    .kpiLabel{
      font-size: 11.5px;
      color: rgba(255,255,255,.55);
      margin-bottom: 6px;
    }
    .kpiValue{
      font-size: 14px;
      color: rgba(255,255,255,.88);
      font-weight: 600;
      letter-spacing: -0.1px;
      overflow:hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    @media (max-width: 560px){
      .kpi{ grid-template-columns: 1fr; }
    }

    .toast{
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      background: rgba(15,23,42,.92);
      border: 1px solid rgba(255,255,255,.14);
      color: rgba(255,255,255,.92);
      padding: 10px 12px;
      border-radius: 999px;
      box-shadow: 0 18px 40px rgba(0,0,0,.35);
      font-size: 13px;
      opacity: 0;
      pointer-events:none;
      transition: opacity .2s ease, transform .2s ease;
      display:flex;
      align-items:center;
      gap: 8px;
      z-index: 50;
    }
    .toast.show{
      opacity: 1;
      transform: translateX(-50%) translateY(-6px);
    }

    .overlay{
      position:absolute;
      inset: 16px;
      border-radius: 16px;
      background: rgba(0,0,0,.32);
      border: 1px solid rgba(255,255,255,.10);
      display:none;
      align-items:center;
      justify-content:center;
      gap: 10px;
      backdrop-filter: blur(8px);
      z-index: 5;
    }
    .overlay.show{ display:flex; }

    .spinner{
      width: 14px; height: 14px;
      border-radius: 999px;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: rgba(255,255,255,.95);
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin{ to { transform: rotate(360deg); } }

    .overlayText{
      font-size: 12.5px;
      color: rgba(255,255,255,.86);
    }

    .footer{
      margin-top: 14px;
      color: rgba(255,255,255,.50);
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M7 3.75h6.2c.4 0 .78.16 1.06.44l2.55 2.55c.28.28.44.66.44 1.06V18.5A1.75 1.75 0 0 1 15.5 20.25H7A1.75 1.75 0 0 1 5.25 18.5V5.5A1.75 1.75 0 0 1 7 3.75Z" stroke="rgba(255,255,255,.92)" stroke-width="1.6" />
            <path d="M13.25 3.9V7.2c0 .55.45 1 1 1h3.3" stroke="rgba(255,255,255,.92)" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M9 10.2h5.4M9 13h6.2M9 15.8h4.2" stroke="rgba(255,255,255,.85)" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M18.7 12.1l.35 1.05c.07.22.24.39.46.46l1.05.35-1.05.35a.72.72 0 0 0-.46.46l-.35 1.05-.35-1.05a.72.72 0 0 0-.46-.46l-1.05-.35 1.05-.35c.22-.07.39-.24.46-.46l.35-1.05Z" fill="rgba(255,255,255,.9)"/>
          </svg>
        </div>
        <div>
          <h1>AI 자기소개서 합격률 분석</h1>
          <p>회사 인재상 + 합격 자소서 요약을 기반으로, 자소서를 점수/피드백으로 분석합니다.</p>
        </div>
      </div>
      <div class="pill" title="현재 페이지 상태">
        <span class="dot"></span>
        <span>GitHub Pages에서 실행 중</span>
      </div>
    </div>

    <div class="grid">
      <!-- Left -->
      <div class="card">
        <div class="cardBody">
          <form id="essayForm">
            <div class="fieldRow">
              <div>
                <label for="companyName">회사 이름</label>
                <input id="companyName" type="text" placeholder="예: KOICA" required />
              </div>
              <div>
                <label for="companyUrl">회사 인재상 URL</label>
                <input id="companyUrl" type="url" placeholder="https://..." required />
              </div>
            </div>

            <div>
              <label for="userEssay">자기소개서</label>
              <textarea id="userEssay" placeholder="자기소개서 내용을 붙여넣으세요." required></textarea>
            </div>

            <div class="actions">
              <div class="leftActions">
                <button id="analyzeBtn" class="btn btnPrimary" type="submit">
                  <span id="analyzeIcon">✨</span>
                  <span id="analyzeText">분석하기</span>
                </button>

                <button id="sampleBtn" class="btn" type="button">🧩 예시 채우기</button>
                <button id="clearBtn" class="btn btnDanger" type="button">🧹 초기화</button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <!-- Right -->
      <div class="card rightCard">
        <div class="resultTop">
          <div style="min-width:0;">
            <div class="scoreWrap">
              <div class="score" id="scoreText">—</div>
              <div class="scoreMeta" id="scoreMeta">점수/등급</div>
            </div>
            <div class="progress" aria-label="점수 진행바">
              <div class="bar" id="bar"></div>
            </div>
          </div>
        </div>

        <div class="resultBody">
          <div class="overlay" id="loadingOverlay">
            <span class="spinner"></span>
            <span class="overlayText">분석 중…</span>
          </div>

          <div class="resultText" id="resultBox">결과가 여기에 표시됩니다.</div>

          <div class="resultActions">
            <button id="copyBtn" class="btn" type="button">📋 결과 복사</button>
          </div>
        </div>

        <div class="kpi">
          <div class="kpiItem">
            <div class="kpiLabel">회사</div>
            <div class="kpiValue" id="kpiCompany">—</div>
          </div>
          <div class="kpiItem">
            <div class="kpiLabel">문자 수</div>
            <div class="kpiValue" id="kpiLen">—</div>
          </div>
        </div>
      </div>
    </div>

    <div class="footer">© AI Essay Analyzer · Frontend on GitHub Pages · Powered by n8n</div>
  </div>

  <div class="toast" id="toast"><span>✅</span><span id="toastMsg">복사 완료</span></div>

  <script>
    const WEBHOOK_URL = "https://primary-production-b57a.up.railway.app/webhook/final_essay";

    const el = (id) => document.getElementById(id);

    const form = el("essayForm");
    const analyzeBtn = el("analyzeBtn");
    const analyzeText = el("analyzeText");
    const analyzeIcon = el("analyzeIcon"); // 아이콘 고정

    const resultBox = el("resultBox");
    const scoreText = el("scoreText");
    const scoreMeta = el("scoreMeta");
    const bar = el("bar");

    const kpiCompany = el("kpiCompany");
    const kpiLen = el("kpiLen");

    const toast = el("toast");
    const toastMsg = el("toastMsg");

    const sampleBtn = el("sampleBtn");
    const clearBtn = el("clearBtn");
    const copyBtn = el("copyBtn");

    const loadingOverlay = el("loadingOverlay");

    function showToast(msg){
      toastMsg.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1400);
    }

    // ✅ 분석 중에도 버튼 텍스트는 "분석하기" 유지
    function setLoading(isLoading){
      analyzeBtn.disabled = isLoading;
      if(isLoading){
        loadingOverlay.classList.add("show");
      } else {
        loadingOverlay.classList.remove("show");
      }
    }

    function updateKpi(){
      const name = el("companyName").value.trim() || "—";
      const essay = el("userEssay").value || "";
      kpiCompany.textContent = name;
      kpiLen.textContent = essay ? `${essay.length.toLocaleString()}자` : "—";
    }

    function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }

    function parseScore(text){
      const m = text.match(/점수\s*[:：]\s*(\d{1,3})\s*점/);
      if(m) return clamp(parseInt(m[1],10), 0, 100);
      const m2 = text.match(/(\d{1,3})\s*점/);
      if(m2) return clamp(parseInt(m2[1],10), 0, 100);
      return null;
    }

    function setScoreUI(score){
      if(score === null){
        scoreText.textContent = "—";
        scoreMeta.textContent = "점수/등급";
        bar.style.width = "0%";
        return;
      }
      scoreText.textContent = score;
      let grade = "보통";
      if(score >= 85) grade = "높음";
      else if(score >= 70) grade = "보통";
      else grade = "낮음";
      scoreMeta.textContent = `점 · 합격률 ${grade}`;
      bar.style.width = `${score}%`;
    }

    async function safeReadText(res){
      try { return await res.text(); } catch { return ""; }
    }

    function prettyError(status, text){
      if(status === 0) return "요청 실패(CORS/네트워크). Webhook URL 또는 CORS 설정을 확인하세요.";
      return `서버 에러 (${status})\n\n${text || ""}`.trim();
    }

    ["companyName","companyUrl","userEssay"].forEach(id=>{
      el(id).addEventListener("input", updateKpi);
    });
    updateKpi();

    sampleBtn.addEventListener("click", () => {
      el("companyName").value = "KOICA";
      el("companyUrl").value = "https://www.koica.go.kr/koica_kr/867/subview.do";
      el("userEssay").value =
`저는 항상 맡은 일을 성실하게 하려고 노력하는 사람입니다. 학교생활을 하면서 다양한 경험을 했고, 이를 통해 많은 것을 배웠습니다.특히 팀 프로젝트에 참여하면서 협력의 중요성을 알게 되었고, 어떤 일이든 최선을 다하는 자세가 필요하다고 느꼈습니다.


지원한 직무에 대해서는 아직 많은 경험이 있는 것은 아니지만, 빠르게 배우고 적응할 자신이 있습니다. 저는 책임감이 강하고 포기하지 않는 성격이기 때문에 회사에서도 꾸준히 성장하는 모습을 보여드리겠습니다.`;
      updateKpi();
      showToast("예시를 채웠어요");
    });

    clearBtn.addEventListener("click", () => {
      form.reset();
      resultBox.textContent = "결과가 여기에 표시됩니다.";
      setScoreUI(null);
      updateKpi();
      showToast("초기화 완료");
    });

    copyBtn.addEventListener("click", async () => {
      const text = resultBox.textContent || "";
      if(!text.trim()){ showToast("복사할 내용이 없어요"); return; }
      try {
        await navigator.clipboard.writeText(text);
        showToast("결과를 복사했어요");
      } catch {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast("결과를 복사했어요");
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const payload = {
        companyName: el("companyName").value.trim(),
        companyUrl: el("companyUrl").value.trim(),
        userEssay: el("userEssay").value
      };

      if(!payload.companyName || !payload.companyUrl || !payload.userEssay){
        resultBox.textContent = "모든 항목을 입력해주세요.";
        setScoreUI(null);
        return;
      }

      setLoading(true);
      setScoreUI(null);

      try {
        const res = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const text = await safeReadText(res);

        if(!res.ok){
          resultBox.textContent = prettyError(res.status, text);
          setScoreUI(null);
          setLoading(false);
          return;
        }

        let outText = text;
        try {
          const data = JSON.parse(text);
          outText = (data && (data.result || data.content)) ? (data.result || data.content) : text;
        } catch {}

        resultBox.textContent = outText;
        setScoreUI(parseScore(outText));
        setLoading(false);
      } catch (err) {
        resultBox.textContent =
"요청 실패(CORS/네트워크).\n\n1) WEBHOOK_URL이 맞는지\n2) n8n Webhook에 CORS 헤더가 있는지\n3) 워크플로우가 Active인지\n를 확인하세요.";
        setScoreUI(null);
        setLoading(false);
      }
    });
  </script>
</body>
</html>
